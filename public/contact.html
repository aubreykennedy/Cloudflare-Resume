<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Aubrey Kennedy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    form { display: grid; gap: 18px; max-width: 520px; margin-top: 28px; }
    .after { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--rule); }
  </style>
</head>
<body>

  <header class="nav">
    <div class="wrap-wide">
      <a class="name" href="index.html">Portfolio</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="professional.html">Professional</a>
        <a href="personal.html">Personal</a>
        <a href="physics.html">Physics</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="page-head">
        <h1>Contact</h1>
        <p>For recruiting, collaboration, or questions, send a message and I'll reply by email.</p>
      </section>

      <form action="https://portfolio-contact-backend.hyhz2cbgh5.workers.dev" method="POST">
        <input type="hidden" name="_next" value="https://aubreykennedy.com/success.html">
        <div>
          <label class="field" for="name">Name</label>
          <input class="input" type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div>
          <label class="field" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div>
          <label class="field" for="message">Message</label>
          <textarea class="input" id="message" name="message" rows="6" required></textarea>
        </div>
        <div><button type="submit" class="btn">Send</button></div>
      </form>

      <p class="after small muted">Résumé: <a href="Aubrey_Kennedy_Resume_2026.pdf" download="Aubrey_Kennedy_Resume.pdf">PDF</a></p>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap-wide"><span>&copy; 2026 Aubrey Kennedy</span></div>
  </footer>
  <script src="assets/site.js"></script>
</body>
</html>
