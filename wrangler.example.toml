# Local-development configuration. Copy this file to wrangler.toml (git-ignored):
#   cp wrangler.example.toml wrangler.toml
# wrangler.toml is deliberately not committed, so Cloudflare Pages never reads a
# placeholder database id; production bindings are set in the dashboard (README.md).
name = "aubreykennedy"
compatibility_date = "2026-09-01"
pages_build_output_dir = "."

# D1 database that backs the admin panel (books, and anything you add later).
# Create it once with:   npx wrangler d1 create aubreykennedy-site
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "aubreykennedy-site"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# R2 bucket that stores uploaded paintings (served at /art/<key>).
# Create it once with:   npx wrangler r2 bucket create aubreykennedy-art
[[r2_buckets]]
binding = "ART"
bucket_name = "aubreykennedy-art"
